name: Bug report
description: Report reproducible incorrect behavior or a regression.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, model weights, secrets, or sensitive paths.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the exact error or incorrect output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, configuration, and whether mock or real inference was used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS/architecture, Rust version, backend version, and model metadata where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or traces
      description: Redact prompts, generated text, full local paths, and secrets.

