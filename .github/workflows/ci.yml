name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.97.1 test --workspace

